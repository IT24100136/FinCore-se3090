name: Backend CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- backend/FinCore.Api backend.tests; then
            echo "Merge conflict markers detected. Resolve conflicts before pushing."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore backend/FinCore.Api/FinCore.Api.csproj

      - name: Build backend
        run: dotnet build backend/FinCore.Api/FinCore.Api.csproj --no-restore
